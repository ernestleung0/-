<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>我的小帳目</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="我的小帳目">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #000000;
      background: #0a0e1a;
      position: relative;
    }

    input, select, textarea {
      -webkit-user-select: auto;
      user-select: auto;
    }

    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #appContainer {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 20px) 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-top: 4px;
    }
    .app-title {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
    }
    .date-display {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 2px;
    }
    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn, .sub-btn, .filter-chip, .pen-btn, .modal-btn, .cal-day-btn {
      cursor: pointer;
      user-select: none;
      transition: all 0.08s ease;
    }

    .icon-btn {
      background: #ffffff;
      border: 1px solid #ced4da;
      border-radius: 20px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 800;
      color: #000000;
      box-shadow: 0 4px 0 #b0b5b9, 0 5px 8px rgba(0,0,0,0.15);
    }
    .icon-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b0b5b9;
      filter: brightness(0.92);
    }

    .summary-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      margin-bottom: 10px;
    }
    .summary-numbers {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .sum-label {
      font-size: 13px;
      font-weight: 800;
      color: #000000;
    }
    .expense-val {
      font-size: 26px;
      font-weight: 900;
      color: #e03131;
    }
    .income-val {
      font-size: 22px;
      font-weight: 900;
      color: #2f9e44;
      text-align: right;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0,0,0,0.12);
      padding-top: 10px;
    }
    .dim-picker {
      display: flex;
      background: #e9ecef;
      border-radius: 10px;
      padding: 2px;
    }
    .dim-btn {
      border: none;
      background: transparent;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
      color: #000;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.08s ease;
    }
    .dim-btn.active {
      background: #ffffff;
      box-shadow: 0 2px 0 #ced4da, 0 3px 6px rgba(0,0,0,0.12);
    }
    .dim-btn:active {
      transform: translateY(2px);
    }

    .nav-actions {
      display: flex;
      gap: 6px;
    }
    .sub-btn {
      background: #ffffff;
      border: 1px solid #ced4da;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      color: #000000;
      border-radius: 8px;
      box-shadow: 0 3px 0 #b0b5b9, 0 4px 6px rgba(0,0,0,0.12);
    }
    .sub-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b0b5b9;
      filter: brightness(0.92);
    }

    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 10px 0;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid #ced4da;
      padding: 7px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      color: #000000;
      box-shadow: 0 3px 0 #ced4da;
    }
    .filter-chip.active {
      background: #d4af37;
      color: #ffffff;
      border-color: #b89628;
      box-shadow: 0 3px 0 #94771b;
    }
    .filter-chip:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #ced4da;
    }

    .record-list {
      flex: 1;
      overflow-y: auto;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 95px;
    }

    .record-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #e03131;
    }

    .delete-swipe-btn {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 90px;
      background: #e03131;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      z-index: 1;
    }

    .record-card {
      position: relative;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      z-index: 2;
      transform: translateX(0);
      transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
      touch-action: pan-y;
    }
    .rec-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .rec-icon {
      font-size: 22px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f1f3f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rec-info {
      display: flex;
      flex-direction: column;
    }
    .rec-title {
      font-size: 16px;
      font-weight: 800;
      color: #000000;
    }
    .rec-time {
      font-size: 12px;
      font-weight: 700;
      color: #495057;
      margin-top: 2px;
    }
    .rec-amount {
      font-size: 17px;
      font-weight: 900;
      color: #000000;
    }

    .bottom-bar {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 20px);
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
      z-index: 20;
    }
    .mic-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid #b89628;
      background: #d4af37;
      color: #ffffff;
      font-size: 28px;
      box-shadow: 0 6px 0 #94771b, 0 8px 18px rgba(0,0,0,0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.08s ease;
    }
    .mic-btn:active {
      transform: translateY(4px) scale(0.96);
      box-shadow: 0 2px 0 #94771b;
    }
    .mic-btn.recording {
      background: #fa5252;
      border-color: #c92a2a;
      box-shadow: 0 6px 0 #a61e1e;
      animation: pulse 1.2s infinite;
    }
    .pen-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 1px solid #ced4da;
      background: #ffffff;
      color: #000000;
      font-size: 22px;
      box-shadow: 0 4px 0 #b0b5b9, 0 6px 12px rgba(0,0,0,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.08s ease;
    }
    .pen-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b0b5b9;
      filter: brightness(0.92);
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(250, 82, 82, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(250, 82, 82, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(250, 82, 82, 0); }
    }

    .speech-tip {
      position: absolute;
      bottom: 98px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.98);
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      color: #000000;
      box-shadow: 0 3px 12px rgba(0,0,0,0.2);
      white-space: nowrap;
      display: none;
      z-index: 25;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-header h3 {
      font-size: 18px;
      font-weight: 800;
      color: #000;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: #000;
      margin-bottom: 4px;
    }
    .input-group input, .input-group select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ced4da;
      border-radius: 10px;
      color: #000;
      background: #f8f9fa;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-cancel {
      background: #e9ecef;
      color: #000;
      box-shadow: 0 3px 0 #ced4da;
    }
    .btn-cancel:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #ced4da;
    }
    .btn-save {
      background: #d4af37;
      color: #fff;
      box-shadow: 0 3px 0 #94771b;
    }
    .btn-save:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #94771b;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .cal-title {
      font-size: 17px;
      font-weight: 900;
      color: #000;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .cal-weekday {
      font-size: 12px;
      font-weight: 800;
      color: #868e96;
      padding-bottom: 4px;
    }
    .cal-day-btn {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1px solid #e9ecef;
      background: #f8f9fa;
      font-size: 14px;
      font-weight: 800;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 #dee2e6;
    }
    .cal-day-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 0;
    }
    .cal-day-btn.selected {
      background: #d4af37;
      color: #ffffff;
      border-color: #94771b;
      box-shadow: 0 2px 0 #94771b;
    }
    .cal-day-btn.empty {
      background: transparent;
      border: none;
      box-shadow: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div id="appContainer">
    <div class="top-bar">
      <div>
        <div class="app-title" id="appTitle">我的小帳目</div>
        <div class="date-display" id="dateDisplay">載入中...</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" onclick="exportToExcel()">📊 匯出Excel</button>
        <button class="icon-btn" onclick="switchTheme()">🎨 主題</button>
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-numbers">
        <div>
          <div class="sum-label">總支出</div>
          <div class="expense-val" id="totalExpenseDisplay">$0.00</div>
        </div>
        <div>
          <div class="sum-label" style="text-align: right;">總收入</div>
          <div class="income-val" id="totalIncomeDisplay">$0.00</div>
        </div>
      </div>
      <div class="controls-row">
        <div class="dim-picker">
          <button class="dim-btn active" onclick="setDimension('day')">日</button>
          <button class="dim-btn" onclick="setDimension('month')">月</button>
          <button class="dim-btn" onclick="setDimension('year')">年</button>
        </div>
        <div class="nav-actions">
          <button class="sub-btn" onclick="shiftDate(-1)">◀ 前一天</button>
          <button class="sub-btn" onclick="openDateModal()">📅 挑選日期</button>
          <button class="sub-btn" onclick="shiftDate(1)">後一天 ▶</button>
        </div>
      </div>
    </div>

    <div class="filter-scroll" id="categoryChips">
      <button class="filter-chip active" onclick="filterCategory(null)">全部</button>
      <button class="filter-chip" onclick="filterCategory('餐飲美食')">餐飲美食</button>
      <button class="filter-chip" onclick="filterCategory('交通出行')">交通出行</button>
      <button class="filter-chip" onclick="filterCategory('購物消費')">購物消費</button>
      <button class="filter-chip" onclick="filterCategory('休閒娛樂')">休閒娛樂</button>
      <button class="filter-chip" onclick="filterCategory('居家生活')">居家生活</button>
      <button class="filter-chip" onclick="filterCategory('醫療健康')">醫療健康</button>
      <button class="filter-chip" onclick="filterCategory('薪資收入')">薪資收入</button>
      <button class="filter-chip" onclick="filterCategory('其他雜項')">其他雜項</button>
    </div>

    <div class="record-list" id="recordList"></div>

    <div class="speech-tip" id="speechTip">正在聆聽中... (請再按一下麥克風停止)</div>

    <div class="bottom-bar">
      <button class="pen-btn" onclick="openManualModal()">✏️</button>
      <button class="mic-btn" id="micBtn" onclick="toggleSpeech()">🎙️</button>
    </div>
  </div>

  <!-- 手動記帳彈窗（含 DeepSeek Key 設置） -->
  <div class="modal-overlay" id="manualModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>新增記帳記錄</h3>
        <span style="font-size: 22px; cursor: pointer; font-weight: bold;" onclick="closeManualModal()">✕</span>
      </div>
      <div class="input-group">
        <label>智能輸入（自動推斷金額與主體）</label>
        <input type="text" id="manualInputText" placeholder="如：去咗薩莉亞食咗60" oninput="autoParseInput(this.value)">
      </div>
      <div class="input-group">
        <label>項目名稱</label>
        <input type="text" id="manualTitle" placeholder="項目名稱">
      </div>
      <div class="input-group">
        <label>金額 (HKD)</label>
        <input type="number" step="0.01" id="manualAmount" placeholder="0.00">
      </div>
      <div class="input-group">
        <label>分類</label>
        <select id="manualCategory">
          <option value="餐飲美食">餐飲美食</option>
          <option value="交通出行">交通出行</option>
          <option value="購物消費">購物消費</option>
          <option value="休閒娛樂">休閒娛樂</option>
          <option value="居家生活">居家生活</option>
          <option value="醫療健康">醫療健康</option>
          <option value="薪資收入">薪資收入</option>
          <option value="其他雜項">其他雜項</option>
        </select>
      </div>
      <div class="input-group">
        <label style="color: #868e96; font-size: 11px;">DeepSeek API Key (選填，填入可開啟大模型語意分析)</label>
        <input type="password" id="deepseekApiKey" placeholder="sk-..." onchange="saveApiKey(this.value)">
      </div>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closeManualModal()">取消</button>
        <button class="modal-btn btn-save" id="btnSaveRecord" onclick="saveManualRecord()">儲存</button>
      </div>
    </div>
  </div>

  <!-- 大日曆彈窗 -->
  <div class="modal-overlay" id="calendarModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>選擇翻查日期</h3>
        <span style="font-size: 22px; cursor: pointer; font-weight: bold;" onclick="closeDateModal()">✕</span>
      </div>
      <div class="calendar-header">
        <button class="sub-btn" onclick="shiftCalendarMonth(-1)">◀ 上個月</button>
        <div class="cal-title" id="calMonthTitle">2026年 9月</div>
        <button class="sub-btn" onclick="shiftCalendarMonth(1)">下個月 ▶</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="modal-actions" style="margin-top: 18px;">
        <button class="modal-btn btn-cancel" onclick="jumpToday()">返回今日</button>
        <button class="modal-btn btn-cancel" onclick="closeDateModal()">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // MARK: - 1. 主題配色
    const THEMES = [
      {
        name: "流沙星辰",
        bg1: "#0a0e1a",
        bg2: "#1d1633",
        primary: "#d4af37",
        btnShadow: "#94771b",
        titleColor: "#ffffff",
        subColor: "rgba(255,255,255,0.85)",
        particleColor: "rgba(255, 230, 150, 0.85)",
        isStar: true
      },
      {
        name: "櫻花紛飛",
        bg1: "#fff0f5",
        bg2: "#ffd1dc",
        primary: "#e64980",
        btnShadow: "#b82a5a",
        titleColor: "#000000",
        subColor: "#222222",
        particleColor: "rgba(255, 183, 197, 0.85)",
        isStar: false
      },
      {
        name: "京都抹茶",
        bg1: "#f4f9f4",
        bg2: "#c8e6c9",
        primary: "#388e3c",
        btnShadow: "#236326",
        titleColor: "#000000",
        subColor: "#222222",
        particleColor: "rgba(129, 199, 132, 0.8)",
        isStar: false
      },
      {
        name: "淺草夜櫻",
        bg1: "#1a1b2f",
        bg2: "#283e58",
        primary: "#e27d8c",
        btnShadow: "#a84e5b",
        titleColor: "#ffffff",
        subColor: "rgba(255,255,255,0.85)",
        particleColor: "rgba(248, 187, 208, 0.85)",
        isStar: false
      }
    ];

    let currentThemeIdx = 0;

    // MARK: - 2. 狀態管理
    let records = [];
    try {
      const stored = localStorage.getItem('my_ledger_records');
      if (stored) records = JSON.parse(stored);
    } catch(e) { records = []; }

    if (records.length === 0) {
      records = [
        { id: 1, title: "薩莉亞", amount: 60, category: "餐飲美食", isIncome: false, date: new Date().toISOString() },
        { id: 2, title: "港鐵車費", amount: 15.2, category: "交通出行", isIncome: false, date: new Date().toISOString() }
      ];
      saveData();
    }

    let currentDimension = 'day';
    let selectedDate = new Date();
    let calBrowsingDate = new Date();
    let currentCategoryFilter = null;
    let deepseekKey = localStorage.getItem('deepseek_api_key') || '';

    function saveData() {
      try {
        localStorage.setItem('my_ledger_records', JSON.stringify(records));
      } catch(e) {}
    }

    function saveApiKey(val) {
      deepseekKey = val.trim();
      localStorage.setItem('deepseek_api_key', deepseekKey);
    }

    // MARK: - 3. 智慧主題與贅字清理引擎
    const CATEGORY_MAP = {
      "餐飲美食": ["飯", "麵", "食", "咖啡", "外賣", "早餐", "午餐", "晚餐", "茶餐廳", "凍飲", "壽司", "薩莉亞", "starbucks", "m記", "麥當勞", "吉野家", "譚仔", "南記", "酒樓", "cafe", "food", "drink", "晏", "宴"],
      "交通出行": ["搭車", "搭", "行路", "行", "走路", "步行", "車", "車費", "地鐵", "巴士", "的士", "打車", "uber", "八達通", "mtr", "bus", "taxi", "油費", "泊車", "小巴", "渡輪", "電車", "輕鐵", "過海", "walk", "train"],

    const CATEGORY_ICONS = {
      "餐飲美食": "🍴",
      "交通出行": "🚇",
      "購物消費": "🛍️",
      "休閒娛樂": "🎮",

      "薪資收入": "💰",
      "其他雜項": "📦"
    };

    function cleanTitleTopic(text) {
      let s = text;
      // 移除金額及幣值單位
      s = s.replace(/(\$?\s*[0-9]+(\.[0-9]{1,2})?\s*(蚊|元|塊|dollars|hkd|usd)?\$?)/gi, "");

      // 剝除口語贅字
      const stopWords = [
        "我今日", "今日", "琴日", "尋日", "去咗", "去左", "係", "喺", "到", "食咗", "食左", "買咗", "買左",
        "用咗", "用左", "使咗", "使左", "花咗", "花左", "花了", "花費", "用", "食", "買", "搭",
        "仲有", "同埋", "跟住", "加埋", "\\$"
      ];
      for (let w of stopWords) {
        s = s.replace(new RegExp(w, 'g'), "");
      }
      s = s.trim();

      // 特定知名連鎖餐廳補齊全名（提升閱讀品質）
      if (s === "薩莉亞") s = "薩莉亞意式餐廳";
      if (s === "麥當勞" || s.toLowerCase() === "m記") s = "麥當勞";
      if (s === "星巴克") s = "星巴克咖啡";

      return s;
    }

    function parseMultiItemsLocal(text) {
      let normalized = text.replace(/(同埋|加埋|跟住|然後|仲有|，|、|。| and | then |\n|;)/g, ",");
      let segments = normalized.split(",").map(s => s.trim()).filter(s => s.length > 0);

      if (segments.length === 1) {
        const matches = [...text.matchAll(/([0-9]+(\.[0-9]{1,2})?\s*(蚊|元|塊|dollars|hkd|usd)?)/gi)];
        if (matches.length > 1) {
          let subs = [];
          let lastIdx = 0;
          for (let m of matches) {
            let end = m.index + m[0].length;
            subs.push(text.substring(lastIdx, end));
            lastIdx = end;
          }
          if (lastIdx < text.length) subs[subs.length - 1] += text.substring(lastIdx);
          segments = subs;
        }
      }

      let parsedList = [];
      for (let seg of segments) {
        let numMatch = seg.match(/([0-9]+(\.[0-9]{1,2})?)/);
        if (numMatch) {
          let amount = parseFloat(numMatch[0]);
          let isIncome = CATEGORY_MAP["薪資收入"].some(kw => seg.toLowerCase().includes(kw));

          let category = "其他雜項";
          if (isIncome) {
            category = "薪資收入";
          } else {
            for (let cat in CATEGORY_MAP) {
              if (cat === "薪資收入") continue;
              if (CATEGORY_MAP[cat].some(kw => seg.toLowerCase().includes(kw))) {
                category = cat;
                break;
              }
            }
          }

          let title = cleanTitleTopic(seg);
          if (!title) title = category;

          parsedList.push({
            id: Date.now() + Math.random(),
            title: title,
            amount: amount,
            category: category,
            isIncome: isIncome,
            date: new Date().toISOString()
          });
        }
      }
      return parsedList;
    }

    // 可選 DeepSeek 大模型連線分析（有填 Key 才使用）
    async function parseWithDeepSeek(rawText) {
      if (!deepseekKey) return parseMultiItemsLocal(rawText);

      try {
        const prompt = `你是一個專業記帳助手。請分析以下這句話：「${rawText}」。提取出所有記帳項目，去除「去咗、食咗、買咗、用咗」等贅字，直接提取核心主題（如薩莉亞、港鐵車費）。
輸出格式必須是純 JSON 陣列，不要有任何 Markdown 或額外文字，格式如下：
[{"title":"項目名稱","amount":60.0,"category":"餐飲美食","isIncome":false}]
可選分類：餐飲美食、交通出行、購物消費、休閒娛樂、居家生活、醫療健康、薪資收入、其他雜項。`;

        const resp = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${deepseekKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [{ role: 'user', content: prompt }],
            temperature: 0.1
          })
        });

        const data = await resp.json();
        let content = data.choices[0].message.content.trim();
        content = content.replace(/```json/g, '').replace(/```/g, '').trim();
        const jsonList = JSON.parse(content);

        return jsonList.map(item => ({
          id: Date.now() + Math.random(),
          title: item.title,
          amount: parseFloat(item.amount) || 0,
          category: item.category || "其他雜項",
          isIncome: Boolean(item.isIncome),
          date: new Date().toISOString()
        }));
      } catch (err) {
        // 連網失敗或超時，自動回退本地規則
        return parseMultiItemsLocal(rawText);
      }
    }

    // MARK: - 4. 手動按鈕控制語音錄音（停頓不自動中斷）
    let speechRecognitionInstance = null;
    let isSpeechRecording = false;
    let accumulatedTranscript = '';
    let manualStopRequested = false;

    function initSpeechEngine() {
      if (speechRecognitionInstance) return speechRecognitionInstance;
      try {
        const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechClass) return null;
        const rec = new SpeechClass();
        rec.continuous = true; // 開啟持續收音，停頓時不中斷
        rec.interimResults = true;
        rec.lang = 'zh-HK';

        rec.onstart = () => {
          isSpeechRecording = true;
          manualStopRequested = false;
          accumulatedTranscript = '';
          document.getElementById('micBtn').classList.add('recording');
          const tip = document.getElementById('speechTip');
          tip.style.display = 'block';
          tip.innerText = '正在聆聽... (說完請再點擊麥克風停止)';
        };

        rec.onresult = (event) => {
          let currentStr = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            currentStr += event.results[i][0].transcript;
          }
          if (currentStr) {
            accumulatedTranscript = currentStr;
            document.getElementById('speechTip').innerText = currentStr;
          }
        };

        rec.onend = async () => {
          // 若不是使用者主動點擊停止，自動重新啟動保持連線（防系統靜音超時中斷）
          if (!manualStopRequested && isSpeechRecording) {
            try { rec.start(); return; } catch(e) {}
          }

          isSpeechRecording = false;
          document.getElementById('micBtn').classList.remove('recording');
          const tip = document.getElementById('speechTip');
          tip.style.display = 'none';

          if (accumulatedTranscript && !accumulatedTranscript.startsWith('正在聆聽')) {
            tip.style.display = 'block';
            tip.innerText = '正在智慧分析主題...';
            const newItems = await parseWithDeepSeek(accumulatedTranscript);
            tip.style.display = 'none';

            if (newItems.length > 0) {
              records.unshift(...newItems);
              saveData();
              render();
            }
          }
        };

        rec.onerror = (e) => {
          if (manualStopRequested) {
            isSpeechRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('speechTip').style.display = 'none';
          }
        };

        speechRecognitionInstance = rec;
        return rec;
      } catch(e) {
        return null;
      }
    }

    function toggleSpeech() {
      const rec = initSpeechEngine();
      if (!rec) {
        alert("請使用 iPhone Safari 開啟並允許麥克風權限以進行語音記帳。");
        return;
      }
      if (isSpeechRecording) {
        manualStopRequested = true;
        rec.stop();
      } else {
        manualStopRequested = false;
        rec.start();
      }
    }

    // MARK: - 5. 介面渲染與完美回彈滑動刪除
    function formatDateDisplay() {
      const y = selectedDate.getFullYear();
      const m = String(selectedDate.getMonth() + 1).padStart(2, '0');
      const d = String(selectedDate.getDate()).padStart(2, '0');
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const week = days[selectedDate.getDay()];

      if (currentDimension === 'day') return `${y}年${m}月${d}日 ${week}`;
      if (currentDimension === 'month') return `${y}年${m}月`;
      return `${y}年`;
    }

    function shiftDate(delta) {
      if (currentDimension === 'day') {
        selectedDate.setDate(selectedDate.getDate() + delta);
      } else if (currentDimension === 'month') {
        selectedDate.setMonth(selectedDate.getMonth() + delta);
      } else if (currentDimension === 'year') {
        selectedDate.setFullYear(selectedDate.getFullYear() + delta);
      }
      render();
    }

    function setDimension(dim) {
      currentDimension = dim;
      document.querySelectorAll('.dim-btn').forEach((btn, i) => {
        btn.classList.toggle('active', ['day', 'month', 'year'][i] === currentDimension);
      });
      render();
    }

    function filterCategory(cat) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === (cat || '全部'));
      });
      render();
    }

    function deleteRecordById(id) {
      records = records.filter(r => r.id !== id);
      saveData();
      render();
    }

    function render() {
      document.getElementById('dateDisplay').innerText = formatDateDisplay();

      const selY = selectedDate.getFullYear();
      const selM = selectedDate.getMonth();
      const selD = selectedDate.getDate();

      const filtered = records.filter(r => {
        const d = new Date(r.date);
        let timeMatch = false;
        if (currentDimension === 'day') {
          timeMatch = (d.getFullYear() === selY && d.getMonth() === selM && d.getDate() === selD);
        } else if (currentDimension === 'month') {
          timeMatch = (d.getFullYear() === selY && d.getMonth() === selM);
        } else {
          timeMatch = (d.getFullYear() === selY);
        }
        let catMatch = (!currentCategoryFilter || r.category === currentCategoryFilter);
        return timeMatch && catMatch;
      });

      let totalExpense = 0;
      let totalIncome = 0;
      filtered.forEach(r => {
        if (r.isIncome) totalIncome += r.amount;
        else totalExpense += r.amount;
      });

      document.getElementById('totalExpenseDisplay').innerText = `$${totalExpense.toFixed(2)}`;
      document.getElementById('totalIncomeDisplay').innerText = `$${totalIncome.toFixed(2)}`;

      const list = document.getElementById('recordList');
      list.innerHTML = '';

      if (filtered.length === 0) {
        list.innerHTML = `
          <div style="text-align: center; margin-top: 50px; font-weight: 800; color: #000;">
            <div style="font-size: 36px; margin-bottom: 8px;">📭</div>
            暫無此時段記錄
          </div>`;
        return;
      }

      filtered.forEach(r => {
        const itemDate = new Date(r.date);
        const timeStr = `${itemDate.getHours().toString().padStart(2, '0')}:${itemDate.getMinutes().toString().padStart(2, '0')}`;
        const icon = CATEGORY_ICONS[r.category] || "📦";

        const wrapper = document.createElement('div');
        wrapper.className = 'record-wrapper';

        const deleteBtn = document.createElement('div');
        deleteBtn.className = 'delete-swipe-btn';
        deleteBtn.innerText = '刪除 🗑️';
        deleteBtn.onclick = () => deleteRecordById(r.id);

        const card = document.createElement('div');
        card.className = 'record-card';
        card.innerHTML = `
          <div class="rec-left">
            <div class="rec-icon">${icon}</div>
            <div class="rec-info">
              <div class="rec-title">${r.title}</div>
              <div class="rec-time">${r.category} · ${timeStr}</div>
            </div>
          </div>
          <div class="rec-amount" style="color: ${r.isIncome ? '#2f9e44' : '#000000'};">
            ${r.isIncome ? '+' : '-'}$${r.amount.toFixed(2)}
          </div>
        `;

        // 升級雙向手勢控制（支援向右拉回復位）
        let startX = 0;
        let currentX = 0;
        let isOpened = false;

        card.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          card.style.transition = 'none';
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
          const moveX = e.touches[0].clientX;
          const deltaX = moveX - startX;

          if (isOpened) {
            // 已展開狀態下，支援向右拉回 (0 到 -90px 之間跟隨手指)
            if (deltaX > 0) {
              currentX = Math.min(-90 + deltaX, 0);
              card.style.transform = `translateX(${currentX}px)`;
            }
          } else {
            // 未展開狀態下，支援向左拉出
            if (deltaX < 0) {
              currentX = Math.max(deltaX, -100);
              card.style.transform = `translateX(${currentX}px)`;
            }
          }
        }, { passive: true });

        card.addEventListener('touchend', () => {
          card.style.transition = 'transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1)';
          if (isOpened) {
            // 已展開狀態：向右滑動超過 25px 立即自動復位
            if (currentX > -65) {
              card.style.transform = 'translateX(0px)';
              isOpened = false;
              currentX = 0;
            } else {
              card.style.transform = 'translateX(-90px)';
              currentX = -90;
            }
          } else {
            // 未展開狀態：向左滑動超過 35px 則卡在刪除位置
            if (currentX < -35) {
              card.style.transform = 'translateX(-90px)';
              isOpened = true;
              currentX = -90;
            } else {
              card.style.transform = 'translateX(0px)';
              currentX = 0;
            }
          }
        });

        // 點擊卡片本體自動復位
        card.addEventListener('click', () => {
          if (isOpened) {
            card.style.transition = 'transform 0.2s ease-out';
            card.style.transform = 'translateX(0px)';
            isOpened = false;
            currentX = 0;
          }
        });

        wrapper.appendChild(deleteBtn);
        wrapper.appendChild(card);
        list.appendChild(wrapper);
      });
    }

    function renderCalendarView() {
      const year = calBrowsingDate.getFullYear();
      const month = calBrowsingDate.getMonth();
      document.getElementById('calMonthTitle').innerText = `${year}年 ${month + 1}月`;

      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      weekdays.forEach(w => {
        const div = document.createElement('div');
        div.className = 'cal-weekday';
        div.innerText = w;
        grid.appendChild(div);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day-btn empty';
        grid.appendChild(empty);
      }

      for (let day = 1; day <= totalDays; day++) {
        const btn = document.createElement('button');
        btn.className = 'cal-day-btn';
        btn.innerText = day;

        const isCurrentSelected = (
          selectedDate.getFullYear() === year &&
          selectedDate.getMonth() === month &&
          selectedDate.getDate() === day
        );
        if (isCurrentSelected) btn.classList.add('selected');

        btn.onclick = () => {
          selectedDate = new Date(year, month, day);
          currentDimension = 'day';
          document.querySelectorAll('.dim-btn').forEach((b, i) => {
            b.classList.toggle('active', i === 0);
          });
          render();
          closeDateModal();
        };

        grid.appendChild(btn);
      }
    }

    function switchTheme() {
      currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
      applyTheme();
    }

    function applyTheme() {
      const t = THEMES[currentThemeIdx];
      document.getElementById('appTitle').style.color = t.titleColor;
      document.getElementById('dateDisplay').style.color = t.subColor;
      document.querySelectorAll('.filter-chip.active').forEach(chip => {
        chip.style.backgroundColor = t.primary;
        chip.style.boxShadow = `0 3px 0 ${t.btnShadow}`;
      });
      document.getElementById('micBtn').style.backgroundColor = t.primary;

    }

    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth || 375;
      canvas.height = window.innerHeight || 667;
      particles = [];
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 8 + 6,
          speedY: Math.random() * 1.2 + 0.6,
          speedX: Math.random() * 0.8 - 0.4,
          angle: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 1.5,
          swayOffset: Math.random() * Math.PI * 2
        });
      }
    }

    function animate() {
      const t = THEMES[currentThemeIdx];
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, t.bg1);
      grad.addColorStop(1, t.bg2);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = t.particleColor;
      const now = Date.now() / 1000;

      particles.forEach(p => {
        p.y += p.speedY;
        p.x += Math.sin(now + p.swayOffset) * 0.8 + p.speedX;
        p.angle += p.rotSpeed;

        if (p.y > canvas.height + 20) p.y = -20;
        if (p.x > canvas.width + 20) p.x = -20;
        if (p.x < -20) p.x = canvas.width + 20;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.angle * Math.PI) / 180);

        if (t.isStar) {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(0, -p.size);
          ctx.quadraticCurveTo(p.size * 0.8, -p.size * 0.2, p.size * 0.5, p.size * 0.8);
          ctx.quadraticCurveTo(0, p.size, -p.size * 0.5, p.size * 0.8);
          ctx.quadraticCurveTo(-p.size * 0.8, -p.size * 0.2, 0, -p.size);
          ctx.fill();
        }
        ctx.restore();
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    applyTheme();
    render();
    animate();
  </script>
</body>
</html>
