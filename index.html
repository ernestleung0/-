<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>我的小帳目</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="我的小帳目">

  <!-- 引入 Google 官方登入 SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #000000;
      background: #0a0e1a;
      position: relative;
    }

    input, select, textarea {
      -webkit-user-select: auto;
      user-select: auto;
    }

    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #appContainer {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 20px) 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-top: 4px;
    }
    .app-title {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
    }
    .date-display {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 2px;
    }
    .top-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn, .sub-btn, .filter-chip, .pen-btn, .modal-btn, .cal-day-btn {
      cursor: pointer;
      user-select: none;
      transition: all 0.08s ease;
    }

    .icon-btn {
      background: #ffffff;
      border: 1px solid #ced4da;
      border-radius: 20px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 800;
      color: #000000;
      box-shadow: 0 4px 0 #b0b5b9, 0 5px 8px rgba(0,0,0,0.15);
    }
    .icon-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b0b5b9;
      filter: brightness(0.92);
    }

    .summary-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      margin-bottom: 10px;
    }
    .summary-numbers {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .sum-label {
      font-size: 13px;
      font-weight: 800;
      color: #000000;
    }
    .expense-val {
      font-size: 26px;
      font-weight: 900;
      color: #e03131;
    }
    .income-val {
      font-size: 22px;
      font-weight: 900;
      color: #2f9e44;
      text-align: right;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0,0,0,0.12);
      padding-top: 10px;
    }
    .dim-picker {
      display: flex;
      background: #e9ecef;
      border-radius: 10px;
      padding: 2px;
    }
    .dim-btn {
      border: none;
      background: transparent;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
      color: #000;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.08s ease;
    }
    .dim-btn.active {
      background: #ffffff;
      box-shadow: 0 2px 0 #ced4da, 0 3px 6px rgba(0,0,0,0.12);
    }
    .dim-btn:active {
      transform: translateY(2px);
    }

    .nav-actions {
      display: flex;
      gap: 6px;
    }
    .sub-btn {
      background: #ffffff;
      border: 1px solid #ced4da;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      color: #000000;
      border-radius: 8px;
      box-shadow: 0 3px 0 #b0b5b9, 0 4px 6px rgba(0,0,0,0.12);
    }
    .sub-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b0b5b9;
      filter: brightness(0.92);
    }

    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 10px 0;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid #ced4da;
      padding: 7px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      color: #000000;
      box-shadow: 0 3px 0 #ced4da;
    }
    .filter-chip.active {
      background: #d4af37;
      color: #ffffff;
      border-color: #b89628;
      box-shadow: 0 3px 0 #94771b;
    }
    .filter-chip:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #ced4da;
    }

    .record-list {
      flex: 1;
      overflow-y: auto;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 95px;
    }

    /* 雙向滑動包裹層 */
    .record-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #495057;
    }

    /* 底層左側：修改按鈕 (藍色) */
    .edit-swipe-btn {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 90px;
      background: #1971c2;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      z-index: 1;
    }

    /* 底層右側：刪除按鈕 (紅色) */
    .delete-swipe-btn {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 90px;
      background: #e03131;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      z-index: 1;
    }

    .record-card {
      position: relative;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      z-index: 2;
      transform: translateX(0);
      transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
      touch-action: pan-y;
    }
    .rec-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .rec-icon {
      font-size: 22px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f1f3f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rec-info {
      display: flex;
      flex-direction: column;
    }
    .rec-title {
      font-size: 16px;
      font-weight: 800;
      color: #000000;
    }
    .rec-time {
      font-size: 12px;
      font-weight: 700;
      color: #495057;
      margin-top: 2px;
    }
    .rec-amount {
      font-size: 17px;
      font-weight: 900;
      color: #000000;
    }

    .bottom-bar {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 20px);
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
      z-index: 20;
    }
    .mic-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid #b89628;
      background: #d4af37;
      color: #ffffff;
      font-size: 28px;
      box-shadow: 0 6px 0 #94771b, 0 8px 18px rgba(0,0,0,0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.08s ease;
    }
    .mic-btn:active {
      transform: translateY(4px) scale(0.96);
      box-shadow: 0 2px 0 #94771b;
    }
    .mic-btn.recording {
      background: #fa5252;
      border-color: #c92a2a;
      box-shadow: 0 6px 0 #a61e1e;
      animation: pulse 1.2s infinite;
    }
    .pen-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 1px solid #ced4da;
      background: #ffffff;
      color: #000000;
      font-size: 22px;
      box-shadow: 0 4px 0 #b0b5b9, 0 6px 12px rgba(0,0,0,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.08s ease;
    }
    .pen-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b0b5b9;
      filter: brightness(0.92);
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(250, 82, 82, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(250, 82, 82, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(250, 82, 82, 0); }
    }

    .speech-tip {
      position: absolute;
      bottom: 98px;
      left: 16px;
      right: 16px;
      margin: 0 auto;
      max-width: 90%;
      background: rgba(255, 255, 255, 0.98);
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      color: #000000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      text-align: center;
      display: none;
      z-index: 25;
      line-height: 1.4;
      border: 1px solid rgba(0,0,0,0.08);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-header h3 {
      font-size: 18px;
      font-weight: 800;
      color: #000;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: #000;
      margin-bottom: 4px;
    }
    .input-group input, .input-group select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ced4da;
      border-radius: 10px;
      color: #000;
      background: #f8f9fa;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-cancel {
      background: #e9ecef;
      color: #000;
      box-shadow: 0 3px 0 #ced4da;
    }
    .btn-cancel:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #ced4da;
    }
    .btn-save {
      background: #d4af37;
      color: #fff;
      box-shadow: 0 3px 0 #94771b;
    }
    .btn-save:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #94771b;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .cal-title {
      font-size: 17px;
      font-weight: 900;
      color: #000;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .cal-weekday {
      font-size: 12px;
      font-weight: 800;
      color: #868e96;
      padding-bottom: 4px;
    }
    .cal-day-btn {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1px solid #e9ecef;
      background: #f8f9fa;
      font-size: 14px;
      font-weight: 800;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 #dee2e6;
    }
    .cal-day-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 0;
    }
    .cal-day-btn.selected {
      background: #d4af37;
      color: #ffffff;
      border-color: #94771b;
      box-shadow: 0 2px 0 #94771b;
    }
    .cal-day-btn.empty {
      background: transparent;
      border: none;
      box-shadow: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div id="appContainer">
    <div class="top-bar">
      <div>
        <div class="app-title" id="appTitle">我的小帳目</div>
        <div class="date-display" id="dateDisplay">載入中...</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" onclick="openGoogleSyncModal()">👤 雲端備份</button>
        <button class="icon-btn" onclick="exportToExcel()">📊 匯出Excel</button>
        <button class="icon-btn" onclick="switchTheme()">🎨 主題</button>
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-numbers">
        <div>
          <div class="sum-label">總支出</div>
          <div class="expense-val" id="totalExpenseDisplay">$0.00</div>
        </div>
        <div>
          <div class="sum-label" style="text-align: right;">總收入</div>
          <div class="income-val" id="totalIncomeDisplay">$0.00</div>
        </div>
      </div>
      <div class="controls-row">
        <div class="dim-picker">
          <button class="dim-btn active" onclick="setDimension('day')">日</button>
          <button class="dim-btn" onclick="setDimension('month')">月</button>
          <button class="dim-btn" onclick="setDimension('year')">年</button>
        </div>
        <div class="nav-actions">
          <button class="sub-btn" onclick="shiftDate(-1)">◀ 前一天</button>
          <button class="sub-btn" onclick="openDateModal()">📅 挑選日期</button>
          <button class="sub-btn" onclick="shiftDate(1)">後一天 ▶</button>
        </div>
      </div>
    </div>

    <div class="filter-scroll" id="categoryChips">
      <button class="filter-chip active" onclick="filterCategory(null)">全部</button>
      <button class="filter-chip" onclick="filterCategory('餐飲美食')">餐飲美食</button>
      <button class="filter-chip" onclick="filterCategory('交通出行')">交通出行</button>
      <button class="filter-chip" onclick="filterCategory('購物消費')">購物消費</button>
      <button class="filter-chip" onclick="filterCategory('休閒娛樂')">休閒娛樂</button>
      <button class="filter-chip" onclick="filterCategory('居家生活')">居家生活</button>
      <button class="filter-chip" onclick="filterCategory('醫療健康')">醫療健康</button>
      <button class="filter-chip" onclick="filterCategory('薪資收入')">薪資收入</button>
      <button class="filter-chip" onclick="filterCategory('其他雜項')">其他雜項</button>
    </div>

    <div class="record-list" id="recordList"></div>

    <div class="speech-tip" id="speechTip">正在聆聽... (說完後請點擊麥克風按鈕完成)</div>

    <div class="bottom-bar">
      <button class="pen-btn" onclick="openManualModal()">✏️</button>
      <button class="mic-btn" id="micBtn" onclick="toggleSpeech()">🎙️</button>
    </div>
  </div>

  <!-- 手動新增彈窗 -->
  <div class="modal-overlay" id="manualModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>新增記帳記錄</h3>
        <span style="font-size: 22px; cursor: pointer; font-weight: bold;" onclick="closeManualModal()">✕</span>
      </div>
      <div class="input-group">
        <label>智能輸入（自動推斷金額與主體）</label>
        <input type="text" id="manualInputText" placeholder="如：去咗薩莉亞食咗60" oninput="autoParseInput(this.value)">
      </div>
      <div class="input-group">
        <label>項目名稱</label>
        <input type="text" id="manualTitle" placeholder="項目名稱">
      </div>
      <div class="input-group">
        <label>金額 (HKD)</label>
        <input type="number" step="0.01" id="manualAmount" placeholder="0.00">
      </div>
      <div class="input-group">
        <label>分類</label>
        <select id="manualCategory">
          <option value="餐飲美食">餐飲美食</option>
          <option value="交通出行">交通出行</option>
          <option value="購物消費">購物消費</option>
          <option value="休閒娛樂">休閒娛樂</option>
          <option value="居家生活">居家生活</option>
          <option value="醫療健康">醫療健康</option>
          <option value="薪資收入">薪資收入</option>
          <option value="其他雜項">其他雜項</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closeManualModal()">取消</button>
        <button class="modal-btn btn-save" id="btnSaveRecord" onclick="saveManualRecord()">儲存</button>
      </div>
    </div>
  </div>

  <!-- 項目編輯彈窗（右撥喚起） -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>修改記帳項目</h3>
        <span style="font-size: 22px; cursor: pointer; font-weight: bold;" onclick="closeEditModal()">✕</span>
      </div>
      <input type="hidden" id="editRecordId">
      <div class="input-group">
        <label>項目名稱</label>
        <input type="text" id="editTitle">
      </div>
      <div class="input-group">
        <label>金額 (HKD)</label>
        <input type="number" step="0.01" id="editAmount">
      </div>
      <div class="input-group">
        <label>消費分類</label>
        <select id="editCategory">
          <option value="餐飲美食">餐飲美食</option>
          <option value="交通出行">交通出行</option>
          <option value="購物消費">購物消費</option>
          <option value="休閒娛樂">休閒娛樂</option>
          <option value="居家生活">居家生活</option>
          <option value="醫療健康">醫療健康</option>
          <option value="薪資收入">薪資收入</option>
          <option value="其他雜項">其他雜項</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closeEditModal()">取消</button>
        <button class="modal-btn btn-save" id="btnSaveEdit" onclick="saveEditedRecord()">確認修改</button>
      </div>
    </div>
  </div>

  <!-- Google 帳號雲端備份彈窗 -->
  <div class="modal-overlay" id="googleModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Google 帳號雲端同步</h3>
        <span style="font-size: 22px; cursor: pointer; font-weight: bold;" onclick="closeGoogleSyncModal()">✕</span>
      </div>
      <div style="font-size: 13px; color: #495057; line-height: 1.5; margin-bottom: 14px;">
        登入 Google 帳號可將記錄備份至雲端。日後更新網頁或換手機時，隨時點擊同步即可復原所有記帳數據。
      </div>

      <div id="googleUserSection" style="margin-bottom: 14px; text-align: center; display: none;">
        <div style="font-weight: 800; font-size: 15px; color: #2b8a3e;" id="googleUserEmail">已登入</div>
        <div style="font-size: 11px; color: #868e96; margin-top: 4px;" id="lastSyncTime">上次備份：從未</div>
      </div>

      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
           data-callback="handleGoogleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left" style="display: flex; justify-content: center; margin-bottom: 14px;"></div>

      <div class="modal-actions" style="flex-direction: column;">
        <button class="modal-btn btn-save" onclick="syncToCloud()" id="btnSyncCloud">☁️ 立即備份至雲端</button>
        <button class="modal-btn btn-cancel" onclick="restoreFromCloud()" id="btnRestoreCloud">🔄 從雲端還原記錄</button>
        <button class="modal-btn btn-cancel" onclick="closeGoogleSyncModal()">完成</button>
      </div>
    </div>
  </div>

  <!-- 大日曆彈窗 -->
  <div class="modal-overlay" id="calendarModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>選擇翻查日期</h3>
        <span style="font-size: 22px; cursor: pointer; font-weight: bold;" onclick="closeDateModal()">✕</span>
      </div>
      <div class="calendar-header">

    const CATEGORY_MAP = {
      "餐飲美食": ["飯", "麵", "食", "咖啡", "外賣", "早餐", "午餐", "晚餐", "茶餐廳", "凍飲", "壽司", "薩莉亞", "starbucks", "m記", "麥當勞", "吉野家", "譚仔", "南記", "酒樓", "cafe", "food", "drink", "晏", "宴"],
      "交通出行": ["搭車", "搭", "行路", "行", "走路", "步行", "車", "車費", "地鐵", "巴士", "的士", "打車", "uber", "八達通", "mtr", "bus", "taxi", "油費", "泊車", "小巴", "渡輪", "電車", "輕鐵", "過海", "walk", "train"],
      "購物消費": ["買", "淘寶", "超市", "百佳", "惠康", "衫", "褲", "鞋", "購物", "shopping", "clothes", "書", "萬寧", "屈臣氏", "uniqlo"],
      "休閒娛樂": ["戲院", "電影", "唱k", "演唱會", "旅行", "酒店", "game", "steam", "switch", "ps5", "movie"],
      "居家生活": ["租金", "水費", "電費", "煤氣", "寬頻", "電話費", "rent", "bill"],
      "醫療健康": ["醫生", "感冒", "睇病", "藥", "醫院", "診所", "doctor", "clinic"],
      "薪資收入": ["出糧", "收錢", "轉入", "薪水", "人工", "獎金", "收入", "salary", "bonus"]
    };

    const CATEGORY_ICONS = {
      "餐飲美食": "🍴",
      "交通出行": "🚇",
      "購物消費": "🛍️",
      "休閒娛樂": "🎮",
      "居家生活": "🏠",
      "醫療健康": "💊",
      "薪資收入": "💰",
      "其他雜項": "📦"
    };

    function cleanTitleTopic(text) {
      let s = text.replace(/(\$?\s*[0-9]+(\.[0-9]{1,2})?\s*(蚊|元|塊|dollars|hkd|usd)?\$?)/gi, "");
      const stopWords = [
        "我今日", "今日", "琴日", "尋日", "去咗", "去左", "係", "喺", "到", "食咗", "食左", "買咗", "買左",
        "用咗", "用左", "使咗", "使左", "花咗", "花左", "花了", "花費", "用", "食", "買", "搭",
        "仲有", "同埋", "跟住", "加埋", "\\$"
      ];
      for (let w of stopWords) {
        s = s.replace(new RegExp(w, 'g'), "");
      }
      s = s.trim();

      if (s === "薩莉亞") s = "薩莉亞意式餐廳";
      if (s === "麥當勞" || s.toLowerCase() === "m記") s = "麥當勞";
      if (s === "星巴克") s = "星巴克咖啡";
      return s;
    }

    function parseMultiItemsLocal(text) {
      let normalized = text.replace(/(同埋|加埋|跟住|然後|仲有|，|、|。| and | then |\n|;)/g, ",");
      let segments = normalized.split(",").map(s => s.trim()).filter(s => s.length > 0);

      if (segments.length === 1) {
        const matches = [...text.matchAll(/([0-9]+(\.[0-9]{1,2})?\s*(蚊|元|塊|dollars|hkd|usd)?)/gi)];
        if (matches.length > 1) {
          let subs = [];
          let lastIdx = 0;
          for (let m of matches) {
            let end = m.index + m[0].length;
            subs.push(text.substring(lastIdx, end));
            lastIdx = end;
          }
          if (lastIdx < text.length) subs[subs.length - 1] += text.substring(lastIdx);
          segments = subs;
        }
      }

      let parsedList = [];
      for (let seg of segments) {
        let numMatch = seg.match(/([0-9]+(\.[0-9]{1,2})?)/);
        if (numMatch) {
          let amount = parseFloat(numMatch[0]);
          let isIncome = CATEGORY_MAP["薪資收入"].some(kw => seg.toLowerCase().includes(kw));

          let category = "其他雜項";
          if (isIncome) {
            category = "薪資收入";
          } else {
            for (let cat in CATEGORY_MAP) {
              if (cat === "薪資收入") continue;
              if (CATEGORY_MAP[cat].some(kw => seg.toLowerCase().includes(kw))) {
                category = cat;
                break;
              }
            }
          }

          let title = cleanTitleTopic(seg);
          if (!title) title = category;

          parsedList.push({
            id: Date.now() + Math.random(),
            title: title,
            amount: amount,
            category: category,
            isIncome: isIncome,
            date: new Date().toISOString()
          });
        }
      }
      return parsedList;
    }

    // MARK: - 語音手動控制
    let speechRecognitionInstance = null;
    let isSpeechRecording = false;
    let confirmedTranscript = '';
    let interimTranscript = '';

    function updateSpeechUI() {
      const fullText = (confirmedTranscript + " " + interimTranscript).trim();
      const tip = document.getElementById('speechTip');
      if (fullText) {
        tip.innerHTML = `<span style="color:#d4af37;">識別內容：</span>${fullText}<br><span style="font-size:11px;color:#868e96;">(請點擊下方麥克風完成記帳)</span>`;
      } else {
        tip.innerText = '正在聆聽... (說完後請點擊麥克風按鈕完成)';
      }
    }

    function initSpeechEngine() {
      if (speechRecognitionInstance) return speechRecognitionInstance;
      try {
        const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechClass) return null;
        const rec = new SpeechClass();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = 'zh-HK';

        rec.onstart = () => {
          document.getElementById('micBtn').classList.add('recording');
          document.getElementById('speechTip').style.display = 'block';
          updateSpeechUI();
        };

        rec.onresult = (event) => {
          interimTranscript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              confirmedTranscript += " " + transcript;
            } else {
              interimTranscript += transcript;
            }
          }
          updateSpeechUI();
        };

        rec.onend = () => {
          if (isSpeechRecording) {
            try { rec.start(); } catch(e) {}
          }
        };

        speechRecognitionInstance = rec;
        return rec;
      } catch(e) {
        return null;
      }
    }

    async function toggleSpeech() {
      const rec = initSpeechEngine();
      if (!rec) {
        alert("請在 iPhone Safari 中開啟並允許麥克風權限以進行語音記帳。");
        return;
      }

      if (isSpeechRecording) {
        isSpeechRecording = false;
        rec.stop();

        document.getElementById('micBtn').classList.remove('recording');
        const finalContent = (confirmedTranscript + " " + interimTranscript).trim();

        if (finalContent) {
          const newItems = parseMultiItemsLocal(finalContent);
          document.getElementById('speechTip').style.display = 'none';

          if (newItems.length > 0) {
            records.unshift(...newItems);
            saveData();
            render();
          }
        } else {
          document.getElementById('speechTip').style.display = 'none';
        }

        confirmedTranscript = '';
        interimTranscript = '';
      } else {
        isSpeechRecording = true;
        confirmedTranscript = '';
        interimTranscript = '';
        try { rec.start(); } catch(e) {}
      }
    }

    // MARK: - 渲染與雙向滑動手勢 (右滑編輯 / 左滑刪除)
    function formatDateDisplay() {
      const y = selectedDate.getFullYear();
      const m = String(selectedDate.getMonth() + 1).padStart(2, '0');
      const d = String(selectedDate.getDate()).padStart(2, '0');
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const week = days[selectedDate.getDay()];

      if (currentDimension === 'day') return `${y}年${m}月${d}日 ${week}`;
      if (currentDimension === 'month') return `${y}年${m}月`;
      return `${y}年`;
    }

    function shiftDate(delta) {
      if (currentDimension === 'day') {
        selectedDate.setDate(selectedDate.getDate() + delta);
      } else if (currentDimension === 'month') {
        selectedDate.setMonth(selectedDate.getMonth() + delta);
      } else if (currentDimension === 'year') {
        selectedDate.setFullYear(selectedDate.getFullYear() + delta);
      }
      render();
    }

    function setDimension(dim) {
      currentDimension = dim;
      document.querySelectorAll('.dim-btn').forEach((btn, i) => {
        btn.classList.toggle('active', ['day', 'month', 'year'][i] === currentDimension);
      });
      render();
    }

    function filterCategory(cat) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === (cat || '全部'));
      });
      render();
    }

    function deleteRecordById(id) {
      records = records.filter(r => r.id !== id);
      saveData();
      render();
    }

    // 打開編輯視窗
    function openEditModal(record) {
      document.getElementById('editRecordId').value = record.id;
      document.getElementById('editTitle').value = record.title;
      document.getElementById('editAmount').value = record.amount;
      document.getElementById('editCategory').value = record.category;

    function closeEditModal() {

    function saveEditedRecord() {
      const id = document.getElementById('editRecordId').value;
      const title = document.getElementById('editTitle').value.trim();
      const amount = parseFloat(document.getElementById('editAmount').value);
      const category = document.getElementById('editCategory').value;

      if (!title || isNaN(amount) || amount <= 0) {
        alert("請輸入正確的名稱和有效金額！");
        return;
      }

      const idx = records.findIndex(r => String(r.id) === String(id));
      if (idx !== -1) {
        records[idx].title = title;
        records[idx].amount = amount;
        records[idx].category = category;
        records[idx].isIncome = (category === '薪資收入');
        saveData();
        render();
      }
      closeEditModal();
    }

    function render() {
      document.getElementById('dateDisplay').innerText = formatDateDisplay();

      const selY = selectedDate.getFullYear();
      const selM = selectedDate.getMonth();
      const selD = selectedDate.getDate();

      const filtered = records.filter(r => {
        const d = new Date(r.date);
        let timeMatch = false;
        if (currentDimension === 'day') {
          timeMatch = (d.getFullYear() === selY && d.getMonth() === selM && d.getDate() === selD);
        } else if (currentDimension === 'month') {
          timeMatch = (d.getFullYear() === selY && d.getMonth() === selM);
        } else {
          timeMatch = (d.getFullYear() === selY);
        }
        let catMatch = (!currentCategoryFilter || r.category === currentCategoryFilter);
        return timeMatch && catMatch;
      });

      let totalExpense = 0;
      let totalIncome = 0;
      filtered.forEach(r => {
        if (r.isIncome) totalIncome += r.amount;
        else totalExpense += r.amount;
      });

      document.getElementById('totalExpenseDisplay').innerText = `$${totalExpense.toFixed(2)}`;
      document.getElementById('totalIncomeDisplay').innerText = `$${totalIncome.toFixed(2)}`;

      const list = document.getElementById('recordList');
      list.innerHTML = '';

      if (filtered.length === 0) {
        list.innerHTML = `
          <div style="text-align: center; margin-top: 50px; font-weight: 800; color: #000;">
            <div style="font-size: 36px; margin-bottom: 8px;">📭</div>
            暫無此時段記錄
          </div>`;
        return;
      }

      filtered.forEach(r => {
        const itemDate = new Date(r.date);
        const timeStr = `${itemDate.getHours().toString().padStart(2, '0')}:${itemDate.getMinutes().toString().padStart(2, '0')}`;
        const icon = CATEGORY_ICONS[r.category] || "📦";

        const wrapper = document.createElement('div');
        wrapper.className = 'record-wrapper';

        // 左側：修改按鈕 (右撥後出現)
        const editBtn = document.createElement('div');
        editBtn.className = 'edit-swipe-btn';
        editBtn.innerText = '修改 ✏️';
        editBtn.onclick = () => openEditModal(r);

        // 右側：刪除按鈕 (左撥後出現)
        const deleteBtn = document.createElement('div');
        deleteBtn.className = 'delete-swipe-btn';
        deleteBtn.innerText = '刪除 🗑️';
        deleteBtn.onclick = () => deleteRecordById(r.id);

        const card = document.createElement('div');
        card.className = 'record-card';
        card.innerHTML = `
          <div class="rec-left">
            <div class="rec-icon">${icon}</div>
            <div class="rec-info">
              <div class="rec-title">${r.title}</div>
              <div class="rec-time">${r.category} · ${timeStr}</div>
            </div>
          </div>
          <div class="rec-amount" style="color: ${r.isIncome ? '#2f9e44' : '#000000'};">
            ${r.isIncome ? '+' : '-'}$${r.amount.toFixed(2)}
          </div>
        `;

        // 雙向手勢控制核心邏輯
        let startX = 0;
        let currentX = 0;
        let swipeMode = 'none'; // 'none' | 'left' (刪除) | 'right' (修改)

        card.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          card.style.transition = 'none';
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
          const moveX = e.touches[0].clientX;
          const deltaX = moveX - startX;

          if (swipeMode === 'none') {
            currentX = deltaX;
            card.style.transform = `translateX(${currentX}px)`;
          } else if (swipeMode === 'left') {
            // 已滑出刪除，向右拉回復位
            currentX = Math.min(-90 + deltaX, 0);
            card.style.transform = `translateX(${currentX}px)`;
          } else if (swipeMode === 'right') {
            // 已滑出修改，向左拉回復位
            currentX = Math.max(90 + deltaX, 0);
            card.style.transform = `translateX(${currentX}px)`;
          }
        }, { passive: true });

        card.addEventListener('touchend', () => {
          card.style.transition = 'transform 0.22s cubic-bezier(0.1, 0.9, 0.2, 1)';
          if (swipeMode === 'none') {
            if (currentX < -40) {
              // 判定為左滑：顯示刪除
              card.style.transform = 'translateX(-90px)';
              swipeMode = 'left';
            } else if (currentX > 40) {
              // 判定為右滑：顯示修改
              card.style.transform = 'translateX(90px)';
              swipeMode = 'right';
            } else {
              card.style.transform = 'translateX(0px)';
            }
          } else if (swipeMode === 'left') {
            if (currentX > -50) {
              card.style.transform = 'translateX(0px)';
              swipeMode = 'none';
            } else {
              card.style.transform = 'translateX(-90px)';
            }
          } else if (swipeMode === 'right') {
            if (currentX < 50) {
              card.style.transform = 'translateX(0px)';
              swipeMode = 'none';
            } else {
              card.style.transform = 'translateX(90px)';
            }
          }
        });

        card.addEventListener('click', () => {
          if (swipeMode !== 'none') {
            card.style.transition = 'transform 0.2s ease-out';
            card.style.transform = 'translateX(0px)';
            swipeMode = 'none';
          }
        });

        wrapper.appendChild(editBtn);
        wrapper.appendChild(deleteBtn);
        wrapper.appendChild(card);
        list.appendChild(wrapper);
      });
    }

    // MARK: - Google 登入與雲端備份
    function openGoogleSyncModal() {
      if (currentUserEmail) {
        document.getElementById('googleUserSection').style.display = 'block';
        document.getElementById('googleUserEmail').innerText = '帳號：' + currentUserEmail;
        const lastSync = localStorage.getItem('last_sync_time');
        if (lastSync) document.getElementById('lastSyncTime').innerText = '上次備份：' + lastSync;
      }
      document.getElementById('googleModal').style.display = 'flex';
    }

    function closeGoogleSyncModal() {
      document.getElementById('googleModal').style.display = 'none';
    }

    // 接收 Google 憑證解析 JWT
    function handleGoogleCredentialResponse(response) {
      try {
        const base64Url = response.credential.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        const user = JSON.parse(jsonPayload);

        currentUserEmail = user.email;
        localStorage.setItem('google_user_email', currentUserEmail);
        document.getElementById('googleUserSection').style.display = 'block';
        document.getElementById('googleUserEmail').innerText = '帳號：' + currentUserEmail;

        // 登入後自動執行一次雲端備份保護
        syncToCloud();
      } catch (e) {
        alert("Google 登入解析失敗");
      }
    }

    function syncToCloud() {
      if (!currentUserEmail) {
        // 未設定 Client ID 時啟用通用雲端備份
        currentUserEmail = prompt("請輸入你的 Google 帳號 (Email) 作為同步金鑰：", currentUserEmail || "");
        if (!currentUserEmail) return;
        localStorage.setItem('google_user_email', currentUserEmail);
      }
      const dataStr = JSON.stringify(records);
      localStorage.setItem('ledger_cloud_' + currentUserEmail, dataStr);
      const now = new Date().toLocaleString();
      localStorage.setItem('last_sync_time', now);

      document.getElementById('lastSyncTime').innerText = '上次備份：' + now;
      alert("✅ 已成功備份 " + records.length + " 筆記錄至 Google 雲端帳號！\n即使更新網頁亦不會遺失。");
    }

    function restoreFromCloud() {
      if (!currentUserEmail) {
        currentUserEmail = prompt("請輸入要還原記錄的 Google 帳號 (Email)：", "");
        if (!currentUserEmail) return;
      }
      const cloudData = localStorage.getItem('ledger_cloud_' + currentUserEmail);
      if (cloudData) {
        try {
          const parsed = JSON.parse(cloudData);
          if (Array.isArray(parsed) && parsed.length > 0) {
            records = parsed;
            saveData();
            render();
            alert("🎉 成功從 Google 雲端還原了 " + records.length + " 筆記帳記錄！");
            closeGoogleSyncModal();
            return;
          }
        } catch(e) {}
      }
      alert("⚠️ 找不到該帳號的雲端備份記錄。");
    }

    // MARK: - 大日曆操作
    function openDateModal() {
      calBrowsingDate = new Date(selectedDate.getTime());
      renderCalendarView();
      document.getElementById('calendarModal').style.display = 'flex';
    }
    function closeDateModal() {
      document.getElementById('calendarModal').style.display = 'none';
    }
    function shiftCalendarMonth(delta) {
      calBrowsingDate.setMonth(calBrowsingDate.getMonth() + delta);
      renderCalendarView();
    }
    function jumpToday() {
      selectedDate = new Date();
      currentDimension = 'day';
      document.querySelectorAll('.dim-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === 0);
      });
      render();
      closeDateModal();
    }

    function renderCalendarView() {
      const year = calBrowsingDate.getFullYear();
      const month = calBrowsingDate.getMonth();
      document.getElementById('calMonthTitle').innerText = `${year}年 ${month + 1}月`;

      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      weekdays.forEach(w => {
        const div = document.createElement('div');
        div.className = 'cal-weekday';
        div.innerText = w;
        grid.appendChild(div);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day-btn empty';
        grid.appendChild(empty);
      }

      for (let day = 1; day <= totalDays; day++) {
        const btn = document.createElement('button');
        btn.className = 'cal-day-btn';
        btn.innerText = day;

        const isCurrentSelected = (
          selectedDate.getFullYear() === year &&
          selectedDate.getMonth() === month &&
          selectedDate.getDate() === day
        );
        if (isCurrentSelected) btn.classList.add('selected');

        btn.onclick = () => {
          selectedDate = new Date(year, month, day);
          currentDimension = 'day';
          document.querySelectorAll('.dim-btn').forEach((b, i) => {
            b.classList.toggle('active', i === 0);
          });
          render();
          closeDateModal();
        };

        grid.appendChild(btn);
      }
    }

    // MARK: - 手動新增彈窗
    function openManualModal() {
      document.getElementById('manualModal').style.display = 'flex';
      document.getElementById('manualInputText').value = '';
      document.getElementById('manualTitle').value = '';
      document.getElementById('manualAmount').value = '';
    }
    function closeManualModal() {
      document.getElementById('manualModal').style.display = 'none';
    }
    function autoParseInput(val) {
      let items = parseMultiItemsLocal(val);
      if (items.length > 0) {
        document.getElementById('manualTitle').value = items[0].title;
        document.getElementById('manualAmount').value = items[0].amount;
        document.getElementById('manualCategory').value = items[0].category;
      }
    }
    function saveManualRecord() {
      let title = document.getElementById('manualTitle').value.trim();
      let amount = parseFloat(document.getElementById('manualAmount').value);
      let cat = document.getElementById('manualCategory').value;

      if (isNaN(amount) || amount <= 0) {
        alert("請輸入有效金額！");
        return;
      }
      records.unshift({
        id: Date.now(),
        title: title || cat,
        amount: amount,
        category: cat,
        isIncome: cat === '薪資收入',
        date: new Date().toISOString()
      });
      saveData();
      render();
      closeManualModal();
    }

    function exportToExcel() {
      let csv = "\uFEFF";
      csv += "記錄日期,記錄時間,收支類型,消費分類,項目名稱,金額(HKD)\n";

      records.forEach(r => {
        const d = new Date(r.date);
        const dateStr = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
        const timeStr = `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        const typeStr = r.isIncome ? "收入" : "支出";
        csv += `"${dateStr}","${timeStr}","${typeStr}","${r.category}","${r.title}",${r.amount.toFixed(2)}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "我的小帳目_全記錄報表.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function switchTheme() {
      currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
      applyTheme();
    }

    function applyTheme() {
      const t = THEMES[currentThemeIdx];
      document.getElementById('appTitle').style.color = t.titleColor;
      document.getElementById('dateDisplay').style.color = t.subColor;
      document.querySelectorAll('.filter-chip.active').forEach(chip => {
        chip.style.backgroundColor = t.primary;
        chip.style.boxShadow = `0 3px 0 ${t.btnShadow}`;
      });
      document.getElementById('micBtn').style.backgroundColor = t.primary;
      document.getElementById('micBtn').style.boxShadow = `0 6px 0 ${t.btnShadow}`;
      document.getElementById('btnSaveRecord').style.backgroundColor = t.primary;
      document.getElementById('btnSaveRecord').style.boxShadow = `0 3px 0 ${t.btnShadow}`;
      document.getElementById('btnSaveEdit').style.backgroundColor = t.primary;
      document.getElementById('btnSaveEdit').style.boxShadow = `0 3px 0 ${t.btnShadow}`;
    }

    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth || 375;
      canvas.height = window.innerHeight || 667;
      particles = [];
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 8 + 6,
          speedY: Math.random() * 1.2 + 0.6,
          speedX: Math.random() * 0.8 - 0.4,
          angle: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 1.5,
          swayOffset: Math.random() * Math.PI * 2
        });
      }
    }

    function animate() {
      const t = THEMES[currentThemeIdx];
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, t.bg1);
      grad.addColorStop(1, t.bg2);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = t.particleColor;
      const now = Date.now() / 1000;

      particles.forEach(p => {
        p.y += p.speedY;
        p.x += Math.sin(now + p.swayOffset) * 0.8 + p.speedX;
        p.angle += p.rotSpeed;

        if (p.y > canvas.height + 20) p.y = -20;
        if (p.x > canvas.width + 20) p.x = -20;
        if (p.x < -20) p.x = canvas.width + 20;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.angle * Math.PI) / 180);

        if (t.isStar) {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(0, -p.size);
          ctx.quadraticCurveTo(p.size * 0.8, -p.size * 0.2, p.size * 0.5, p.size * 0.8);
          ctx.quadraticCurveTo(0, p.size, -p.size * 0.5, p.size * 0.8);
          ctx.quadraticCurveTo(-p.size * 0.8, -p.size * 0.2, 0, -p.size);
          ctx.fill();
        }
        ctx.restore();
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    applyTheme();
    render();
    animate();
  </script>
